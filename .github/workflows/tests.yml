name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run task1 tests
        working-directory: lab5/task1
        run: python -m unittest discover -s tests -v

      - name: Run task2 tests
        working-directory: lab5/task2
        run: python -m unittest discover -s tests -v
